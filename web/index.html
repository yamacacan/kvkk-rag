<!DOCTYPE html>
<html lang="tr" data-theme="dark" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assests/img/logo/kvkk-uyum-ikon.svg">
    <title>KVKK Uyum — Veri Envanteri & Denetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema ilk boyamadan once uygulanir (yanip sonme olmasin): kvkk_ui.tema = dark | light | system
  (function () { try { var t = (JSON.parse(localStorage.getItem("kvkk_ui") || "{}").tema) || "dark";
    if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t); document.documentElement.classList.toggle("dark", t === "dark"); } catch (e) {} })();
</script>
</head>
<body class="min-h-screen bg-bg-0 text-t-1 antialiased selection:bg-indigo-500 selection:text-white">
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
